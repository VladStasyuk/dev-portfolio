name: CI/CD

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint & format check
        run: |
          flake8 api
          black --check api
      - name: Run tests
        run: pytest api

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Test
        run: npm run test
        working-directory: frontend

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs:
      - test-api
      - test-frontend
    steps:
      - uses: actions/checkout@v3
      - name: Deploy
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          working-directory: .
          prod: true
